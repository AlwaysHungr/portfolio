<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title"><title id="title">Από την πηγή στο τεκμηριωμένο συμπέρασμα</title><rect width="1000" height="570" rx="24" fill="#edf5f3"/><text x="44" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#143b35">Από την πηγή στο τεκμηριωμένο συμπέρασμα</text><g transform="translate(44 92)"><rect width="440" height="192" rx="16" fill="white" stroke="#bdd6cf"/><rect x="18" y="18" width="49" height="42" rx="9" fill="#136956"/><text x="42" y="47" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="white">01</text><text x="82" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#143b35">ΠΗΓΗ</text><text x="24" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#183c35">Ποιος το δημοσίευσε;</text><text x="24" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#47645d">Ημερομηνία και έκδοση</text></g><g transform="translate(516 92)"><rect width="440" height="192" rx="16" fill="white" stroke="#bdd6cf"/><rect x="18" y="18" width="49" height="42" rx="9" fill="#136956"/><text x="42" y="47" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="white">02</text><text x="82" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#143b35">ΑΠΟΣΠΑΣΜΑ</text><text x="24" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#183c35">Τι αναφέρει ακριβώς;</text><text x="24" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#47645d">Προϋποθέσεις και εξαιρέσεις</text></g><g transform="translate(44 312)"><rect width="440" height="192" rx="16" fill="white" stroke="#bdd6cf"/><rect x="18" y="18" width="49" height="42" rx="9" fill="#136956"/><text x="42" y="47" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="white">03</text><text x="82" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#143b35">ΙΣΧΥΡΙΣΜΟΣ</text><text x="24" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#183c35">Τι μπορούμε να πούμε;</text><text x="24" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#47645d">Χωρίς αυθαίρετη γενίκευση</text></g><g transform="translate(516 312)"><rect width="440" height="192" rx="16" fill="white" stroke="#bdd6cf"/><rect x="18" y="18" width="49" height="42" rx="9" fill="#136956"/><text x="42" y="47" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="white">04</text><text x="82" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#143b35">ΕΠΑΛΗΘΕΥΣΗ</text><text x="24" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#183c35">Ανοίγω την παραπομπή</text><text x="24" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#47645d">Ελέγχω και δηλώνω τα κενά</text></g><text x="44" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#47645d">AI MASTER · Εκπαιδευτική σύνθεση · Σεπτέμβριος 2026</text></svg>