<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title"><title id="title">Μια ελέγξιμη εργασία με agent</title><rect width="1000" height="570" rx="24" fill="#edf5f3"/><text x="44" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#143b35">Μια ελέγξιμη εργασία με agent</text><g transform="translate(44 92)"><rect width="440" height="192" rx="16" fill="white" stroke="#bdd6cf"/><rect x="18" y="18" width="49" height="42" rx="9" fill="#136956"/><text x="42" y="47" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="white">01</text><text x="82" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#143b35">ΣΤΟΧΟΣ ΚΑΙ ΠΗΓΕΣ</text><text x="24" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#183c35">Τι θέλω να ολοκληρωθεί;</text><text x="24" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#47645d">Ποια στοιχεία επιτρέπονται;</text></g><g transform="translate(516 92)"><rect width="440" height="192" rx="16" fill="white" stroke="#bdd6cf"/><rect x="18" y="18" width="49" height="42" rx="9" fill="#136956"/><text x="42" y="47" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="white">02</text><text x="82" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#143b35">ΣΧΕΔΙΟ ΚΑΙ ΟΡΙΑ</text><text x="24" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#183c35">Ποια βήματα χρειάζονται;</text><text x="24" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#47645d">Πού χρειάζεται επιβεβαίωση;</text></g><g transform="translate(44 312)"><rect width="440" height="192" rx="16" fill="white" stroke="#bdd6cf"/><rect x="18" y="18" width="49" height="42" rx="9" fill="#136956"/><text x="42" y="47" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="white">03</text><text x="82" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#143b35">ΕΝΕΡΓΕΙΑ ΜΕ ΕΡΓΑΛΕΙΟ</text><text x="24" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#183c35">Ανάγνωση ή επεξεργασία</text><text x="24" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#47645d">Στα επιτρεπόμενα συστήματα</text></g><g transform="translate(516 312)"><rect width="440" height="192" rx="16" fill="white" stroke="#bdd6cf"/><rect x="18" y="18" width="49" height="42" rx="9" fill="#136956"/><text x="42" y="47" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="white">04</text><text x="82" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#143b35">ΕΛΕΓΧΟΣ ΑΠΟΤΕΛΕΣΜΑΤΟΣ</text><text x="24" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#183c35">Σύγκριση με τα κριτήρια</text><text x="24" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#47645d">Διόρθωση πριν από χρήση</text></g><text x="44" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#47645d">AI MASTER · Εκπαιδευτική σύνθεση · Σεπτέμβριος 2026</text></svg>