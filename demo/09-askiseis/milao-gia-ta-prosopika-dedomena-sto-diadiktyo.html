<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Μιλάω για τα προσωπικά δεδομένα στο διαδίκτυο</title>
<style>
:root{
  --ink:#14202e;
  --ink-2:#43566d;
  --paper:#e9eef4;
  --card:#ffffff;
  --line:#cdd8e4;
  --mark:#c8353c;          /* το κόκκινο του Μαρκ */
  --me:#0f7a63;            /* οι δικές σου απαντήσεις */
  --me-soft:#e2f2ed;
  --tip:#e2a32b;           /* οι κίτρινες πινακίδες του βίντεο */
  --tip-soft:#fdf4e0;
  --navy:#16243f;
  --radius:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  background-image:radial-gradient(rgba(20,32,46,.07) 1px,transparent 1px);
  background-size:22px 22px;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0 0 .4em;line-height:1.15;letter-spacing:-.015em;font-weight:800}
p{margin:0 0 .8em}

/* ---------- κορυφή & πλοήγηση ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:var(--navy);color:#fff;
  border-bottom:3px solid var(--mark);
}
.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;color:#a9bad4;font-weight:500;letter-spacing:.01em}
.dot-online{width:9px;height:9px;border-radius:50%;background:#4ad295;box-shadow:0 0 0 3px rgba(74,210,149,.25);flex:none}

/* ράγα «μηνυμάτων» = πλοήγηση */
.rail{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.rail button{
  position:relative;font:inherit;font-size:12px;font-weight:700;
  color:#cfdcf0;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);
  border-radius:11px 11px 11px 3px;
  padding:4px 9px;cursor:pointer;line-height:1.3;
  transition:background .15s,color .15s,transform .15s;
}
.rail button:hover{background:rgba(255,255,255,.2)}
.rail button.on{background:#fff;color:var(--navy);border-color:#fff}
.rail button.done::after{content:"✓✓";position:absolute;right:1px;bottom:-10px;font-size:11px;font-weight:800;color:#4ad295;letter-spacing:-1.5px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
:focus-visible{outline:3px solid var(--tip);outline-offset:2px}

/* ---------- σκελετός ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.wrap{display:block}
body.parts .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.screen{display:none}
.screen.on{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.eyebrow{font-size:12.5px;color:var(--ink-2);font-weight:700;margin:0 0 6px}

/* ---------- εξώφυλλο ---------- */
.cover{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:center}
.cover h1{font-size:clamp(26px,4.4vw,42px)}
.cover .en{font-size:clamp(15px,2vw,19px);color:var(--me);font-weight:700;margin:0 0 14px}
.badge{display:inline-block;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;margin-bottom:12px}
.meetcard{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--mark);border-radius:14px;padding:12px 14px;margin:14px 0}
.meetcard .fig{flex:none;width:74px}
.meetcard img{width:74px;height:74px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:2px solid var(--mark);display:block}
.meetcard p{margin:0;font-size:14.5px;color:var(--ink-2)}
.meetcard b{color:var(--ink);display:block;font-size:15.5px}

/* ---------- εικόνες: hover alt + zoom ---------- */
.fig{position:relative;display:block;cursor:zoom-in}
.fig>img{display:block;max-width:100%}
.fig .alt{
  position:absolute;left:50%;bottom:9px;transform:translateX(-50%) translateY(4px);
  background:rgba(20,32,46,.94);color:#fff;font-size:12.5px;line-height:1.35;
  padding:6px 10px;border-radius:9px;max-width:92%;width:max-content;
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:5;
}
.fig:hover .alt,.fig:focus-within .alt{opacity:1;transform:translateX(-50%) translateY(0)}
.credit{font-size:11.5px;color:#7b8ca1;margin:6px 0 0}
.coverfig img{width:100%;border-radius:14px;border:1px solid var(--line)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(12,20,30,.9);display:none;place-items:center;padding:16px;z-index:120}
.lb.on{display:grid}
.lb .box{width:100%;max-width:1200px;min-width:0;position:relative}
.lb img{width:100%;max-height:82vh;object-fit:contain;border-radius:12px;background:#fff}
.lb .cap{color:#dfe8f2;font-size:13.5px;margin-top:10px;text-align:center}
.lb .x{
  position:absolute;top:-14px;right:-8px;width:42px;height:42px;border-radius:50%;
  background:#fff;color:var(--navy);border:none;font-size:22px;font-weight:800;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.35);line-height:1;
}

/* ---------- κουμπιά ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:15px;
  background:var(--navy);color:#fff;border:none;border-radius:11px;padding:11px 18px;cursor:pointer;
  transition:transform .12s,opacity .15s,background .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn[hidden]{display:none}
.btn.g{background:var(--me)}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--line)}
.btn.sm{font-size:13.5px;padding:8px 13px}
.linkish{background:none;border:none;font:inherit;font-size:13px;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:4px 0}

/* ---------- πλαίσιο βίντεο ---------- */
.vpane{position:sticky;top:74px}
.vcard{background:var(--navy);border-radius:var(--radius);overflow:hidden;border:1px solid #0d1830}
.vhead{display:flex;align-items:center;gap:10px;padding:11px 14px;color:#fff;flex-wrap:wrap}
.vhead .t{font-size:15px;font-weight:800;letter-spacing:-.01em}
.vhead .chip{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);padding:3px 10px;border-radius:999px;color:#dbe6f5}
.stage{position:relative;background:linear-gradient(150deg,#12203a,#0a1120);aspect-ratio:16/9;width:100%}
.stage iframe,.stage video,.stage #ytbox{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.stage .shade{position:absolute;inset:0;background:rgba(10,16,28,.55);display:grid;place-items:center;text-align:center;padding:16px;color:#fff}
.stage .shade[hidden]{display:none}
.shade p{font-size:13.5px;color:#cddcf1;max-width:36ch;margin:8px auto 0}
.vctrl{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#101c33;flex-wrap:wrap}
.bar{flex:1 1 120px;height:7px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;width:0;background:var(--mark);border-radius:99px;transition:width .2s linear}
.vctrl .tm{font-size:12.5px;color:#adc0da;font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.vctrl .btn{padding:8px 14px;font-size:14px;background:#fff;color:var(--navy)}
.vctrl .btn.g{background:var(--me);color:#fff}
.vnote{background:#fdf4e0;border:1px solid #efd79a;border-radius:11px;padding:11px 13px;margin-top:10px;font-size:13.5px}
.vnote[hidden]{display:none}
.vnote a{color:#8a5b06}

/* ---------- συνομιλία ---------- */
.chat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.chead{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);background:#f7fafd}
.chead img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:2px solid var(--mark);display:block}
.chead b{font-size:14.5px}
.chead small{display:block;font-size:11.5px;color:var(--ink-2)}
.chead .task{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--me);background:var(--me-soft);padding:3px 9px;border-radius:999px}
.thread{padding:16px 14px;display:flex;flex-direction:column;gap:12px;min-height:180px}

.msg{display:flex;gap:9px;align-items:flex-end;max-width:100%}
.msg .av{flex:none;width:30px}
.msg .av img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 12%;display:block;border:1.5px solid var(--mark)}
.bub{
  background:#f1f5fa;border:1px solid var(--line);border-radius:15px 15px 15px 4px;
  padding:11px 14px;font-size:15.5px;line-height:1.5;max-width:min(46ch,100%);
  animation:pop .28s ease-out;
}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--me-soft);border-color:#b6ded3;border-radius:15px 15px 4px 15px;color:#0c3c32;white-space:pre-wrap}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bub,.typing{animation:none!important}.btn:hover{transform:none}}

.typing{display:inline-flex;gap:4px;align-items:center;background:#f1f5fa;border:1px solid var(--line);border-radius:15px 15px 15px 4px;padding:13px 15px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9db0c6;animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.hint{font-size:13px;color:var(--ink-2);text-align:center;padding:22px 10px;margin:auto 0}

/* συνθέτης */
.composer{border-top:1px solid var(--line);padding:12px 14px;background:#f7fafd}
.composer[hidden]{display:none}
.composer label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.composer textarea{
  width:100%;min-height:92px;resize:vertical;font:inherit;font-size:15.5px;
  border:2px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink);
}
.composer textarea:focus{border-color:var(--me);outline:none}
.crow{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.wc{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wc b{color:var(--me)}

/* ενδεικτική απάντηση */
.sugg{
  border:1px solid #efd79a;background:var(--tip-soft);border-left:6px solid var(--tip);
  border-radius:12px;padding:13px 15px;font-size:15px;animation:pop .3s ease-out;
}
.sugg h4{margin:0 0 6px;font-size:12.5px;font-weight:800;color:#8a5b06}
.sugg p{margin:0 0 .5em;white-space:pre-line}
.sugg p:last-child{margin:0}
.nextrow{display:flex;justify-content:flex-end;gap:10px;padding:0 14px 14px}

/* ---------- λέξεις κλειδιά ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-top:14px}
.flip{background:none;border:none;padding:0;font:inherit;cursor:pointer;perspective:900px;height:118px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;display:block}
.flip.f .in{transform:rotateY(180deg)}
.flip .fa{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;
  border-radius:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--line);background:#fff;font-size:16.5px;font-weight:800;color:var(--navy);
}
.flip .fa.b{transform:rotateY(180deg);background:var(--me);border-color:var(--me);color:#fff;font-size:15px;font-weight:700}
.counter{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-top:14px}
.counter b{color:var(--me);font-size:17px}

/* ---------- τέλος ---------- */
.recap{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.rec{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
.rec .q{background:#f1f5fa;padding:11px 14px;font-size:14.5px;border-bottom:1px solid var(--line)}
.rec .q b{display:block;font-size:11.5px;color:var(--mark);margin-bottom:3px}
.rec .a{padding:11px 14px;font-size:15px;white-space:pre-wrap}
.rec .a em{color:var(--ink-2);font-style:normal}
.rec .s{padding:11px 14px;background:var(--tip-soft);border-top:1px solid #efd79a;font-size:14.5px;white-space:pre-line}
.rec .s b{display:block;font-size:11.5px;color:#8a5b06;margin-bottom:3px}
.srcs{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.srcs h3{font-size:14px;margin-bottom:8px}
.srcs p{margin:0 0 .5em}
.srcs a{color:var(--me);word-break:break-word}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (max-width:900px){
  body.parts .wrap{grid-template-columns:1fr}
  .vpane{position:static;margin-bottom:16px}
  .cover{grid-template-columns:1fr}
  .top .in{padding:9px 12px;gap:9px}
  .rail{margin-left:0;width:100%}
  .rail button{flex:1 1 auto;text-align:center;padding:5px 6px}
  main{padding:14px 12px 50px}
  .panel{padding:16px}
}
</style>
</head>
<body>

<header class="top">
  <div class="in">
    <div class="brand">
      <span class="dot-online"></span>
      <span><b>Mark</b><small>What is Grooming? · Safety on the Internet</small></span>
    </div>
    <nav class="rail" id="rail" aria-label="Πλοήγηση"></nav>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- ΠΛΑΙΣΙΟ ΒΙΝΤΕΟ (εμφανίζεται μόνο στα μέρη 1-5) -->
    <div class="vpane" id="vpane" hidden>
      <div class="vcard">
        <div class="vhead">
          <span class="t">What is Grooming?</span>
          <span class="chip" id="vchip">Μέρος 1 από 5</span>
        </div>
        <div class="stage" id="stage">
          <div id="ytbox"></div>
          <div class="shade" id="shade">
            <div>
              <button class="btn" id="playBtn" type="button">▶ Παίξε αυτό το μέρος</button>
              <p id="shadeTxt">Το βίντεο θα σταματήσει μόνο του και ο Μαρκ θα σου γράψει.</p>
            </div>
          </div>
        </div>
        <div class="vctrl">
          <button class="btn sm" id="pauseBtn" type="button" hidden>❚❚ Παύση</button>
          <button class="btn sm g" id="againBtn" type="button" hidden>↻ Δες το ξανά</button>
          <div class="bar"><i id="barFill"></i></div>
          <span class="tm" id="tm">0:00 / 0:44</span>
        </div>
      </div>
      <div class="vnote" id="vnote" hidden>
        <p style="margin:0 0 8px"><strong id="vnoteT">Δεν παίζει το βίντεο εδώ;</strong> <span id="vnoteM">Άνοιξέ το σε νέα καρτέλα και δες το μέρος που σου αναλογεί.</span></p>
        <p style="margin:0 0 10px"><a id="vlink" href="https://www.youtube.com/watch?v=lAap7pun0c4" target="_blank" rel="noopener">Άνοιγμα του βίντεο στο YouTube ▸</a></p>
        <button class="btn sm ghost" id="skipBtn" type="button">Το είδα — πάμε στην ερώτηση</button>
      </div>
      <button class="linkish" id="troubleBtn" type="button">Δεν παίζει το βίντεο;</button>
    </div>

    <!-- ΟΘΟΝΕΣ -->
    <div id="screens"></div>

  </div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Μεγέθυνση εικόνας">
  <div class="box">
    <button class="x" id="lbx" type="button" aria-label="Κλείσιμο">×</button>
    <img id="lbimg" alt="">
    <p class="cap" id="lbcap"></p>
  </div>
</div>
<div class="toast" id="toast"></div>

        '</span>'+
        '<span><b>Mark</b><small>Safety on the Internet</small></span>'+
        '<span class="task">Ερώτηση '+n+' από 5</span>'+
      '</div>'+
      '<div class="thread" id="th'+i+'">'+
        '<p class="hint" id="hint'+i+'">Δες πρώτα το μέρος '+n+' του βίντεο. Μόλις τελειώσει, ο Μαρκ θα σου γράψει.</p>'+
      '</div>'+
      '<div class="composer" id="cmp'+i+'" hidden>'+
        '<label for="ta'+i+'">Η σύντομη απάντησή σου στα αγγλικά</label>'+
        '<textarea id="ta'+i+'" placeholder="Write one short answer for Mark…"></textarea>'+
        '<div class="crow">'+
          '<span class="wc" id="wc'+i+'"><b>0</b> λέξεις</span>'+
          '<button class="btn g" id="send'+i+'" type="button" disabled style="margin-left:auto">Στείλε στον Μαρκ</button>'+
        '</div>'+
      '</div>'+
      '<div class="nextrow"><button class="btn" id="nx'+i+'" data-go="'+(n+1)+'" hidden>'+(n<5?'Επόμενο μέρος':'Λέξεις κλειδιά')+'</button></div>'+
    '</div>'+
  '</section>';
}

/* 6. Λέξεις κλειδιά */
var kh='';
for(var k=0;k<KEYS.length;k++){
  kh += '<button class="flip" type="button" data-k="'+k+'">'+
        '<span class="in">'+
          '<span class="fa">'+esc(KEYS[k][0])+'</span>'+
          '<span class="fa b">'+esc(KEYS[k][1])+'</span>'+
        '</span></button>';
}
html += '<section class="screen" id="sc6">'+
  '<div class="panel">'+
    '<p class="eyebrow">Safety on the Internet</p>'+
    '<h2>Λέξεις κλειδιά</h2>'+
    '<p style="color:var(--ink-2);font-size:15px">Γύρισε κάθε κάρτα για να δεις την απόδοση στα ελληνικά.</p>'+
    '<div class="cards">'+kh+'</div>'+
    '<p class="counter">Γύρισες <b id="kcount">0</b> από 5 κάρτες</p>'+
    '<p style="margin-top:14px"><button class="btn" data-go="7">Δες τη συνομιλία σου</button></p>'+
  '</div>'+
'</section>';

/* 7. Τέλος */
html += '<section class="screen" id="sc7">'+
  '<div class="panel">'+
    '<h2>Η συνομιλία σου με τον Μαρκ</h2>'+
    '<p style="color:var(--ink-2);font-size:15px">Οι πέντε απαντήσεις σου, μαζί με τις ενδεικτικές απαντήσεις.</p>'+
    '<div class="recap" id="recap"></div>'+
    '<p style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'+
      '<button class="btn g" id="copyBtn" type="button">Αντιγραφή των απαντήσεών σου</button>'+
      '<button class="btn ghost" data-go="1">Ξεκίνα ξανά από το μέρος 1</button>'+
    '</p>'+
    '<div class="srcs">'+
      '<h3>Πηγές</h3>'+
      '<p>Cyber Alert. (n.d.). <em>Στο διαδίκτυο δεν είναι όλα όπως φαίνονται. Ενημερώσου για το grooming</em> [Video]. YouTube. Retrieved from: <a href="https://www.youtube.com/watch?v=lAap7pun0c4" target="_blank" rel="noopener">https://www.youtube.com/watch?v=lAap7pun0c4</a></p>'+
      '<p>Φωτογραφία εξωφύλλου: AI generated, No copyrights needed, Chat GPT 3/08/2026. Alternative text: '+esc(ALT_COVER)+'</p>'+
      '<p>Φωτογραφία του Μαρκ: AI generated, No copyrights, Chat GPT 3/08/2026. Alternative text: '+esc(ALT_MARK)+'</p>'+
    '</div>'+
  '</div>'+
'</section>';

screens.innerHTML = html;

/* εικόνες από τον χάρτη ASSETS */
Array.prototype.forEach.call(document.querySelectorAll("img[data-key]"), function(img){
  img.src = ASSETS[img.getAttribute("data-key")];
});

/* ---------------- ράγα πλοήγησης ---------------- */
var LABELS = ["Αρχή","1","2","3","4","5","Λέξεις","Τέλος"];
var rail = el("rail");
LABELS.forEach(function(l,idx){
  var b=document.createElement("button");
  b.type="button"; b.textContent=l; b.setAttribute("data-go",idx);
  b.title = idx>=1&&idx<=5 ? ("Μέρος "+idx) : l;
  rail.appendChild(b);
});

var cur=-1;
function go(n){
  if(n<0||n>7) return;
  cur=n;
  Array.prototype.forEach.call(document.querySelectorAll(".screen"),function(s,idx){
    s.classList.toggle("on", idx===n);
  });
  Array.prototype.forEach.call(rail.children,function(b,idx){
    b.classList.toggle("on", idx===n);
  });
  var isPart = n>=1 && n<=5;
  document.body.classList.toggle("parts", isPart);
  el("vpane").hidden = !isPart;
  if(isPart) mountPart(n-1);
  else stopVideo();
  if(n===7) buildRecap();
  window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-go]") : null;
  if(!t || t.disabled) return;
  go(parseInt(t.getAttribute("data-go"),10));
});
document.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(el("lb").classList.contains("on")) return;
  if(e.key==="ArrowRight") go(Math.min(7,cur+1));
  if(e.key==="ArrowLeft")  go(Math.max(0,cur-1));
});

/* ---------------- lightbox + alt ---------------- */
var lb=el("lb"), lbimg=el("lbimg"), lbcap=el("lbcap");
document.addEventListener("click", function(e){
  var f = e.target.closest ? e.target.closest("[data-zoom]") : null;
  if(!f) return;
  var key=f.getAttribute("data-zoom");
  lbimg.src = ASSETS[key];
  lbimg.alt = f.getAttribute("data-alt")||"";
  lbcap.textContent = f.getAttribute("data-alt")||"";
  lb.classList.add("on");
});
function closeLb(){ lb.classList.remove("on"); }
el("lbx").addEventListener("click", closeLb);
lb.addEventListener("click", function(e){ if(e.target===lb) closeLb(); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeLb(); });
document.addEventListener("keydown", function(e){
  if(e.key!=="Enter"&&e.key!==" ") return;
  var f=document.activeElement;
  if(f && f.hasAttribute && f.hasAttribute("data-zoom")){ e.preventDefault(); f.click(); }
});

/* ---------------- player ---------------- */
var player=null, ready=false, timer=null, curPart=0, useLocal=!!VIDEO_SRC, vEl=null;

function buildPlayer(){
  if(useLocal){
    vEl=document.createElement("video");
    vEl.setAttribute("playsinline","");
    vEl.src=VIDEO_SRC;
    el("ytbox").parentNode.insertBefore(vEl, el("ytbox"));
    el("ytbox").style.display="none";
    ready=true;
    return;
  }
  var https = /^https?:$/.test(location.protocol);
  if(!https){
    // Τοπικό αρχείο (file://): ο browser δεν στέλνει referrer/origin και το YouTube
    // απορρίπτει το ενσωματωμένο player (σφάλμα 153).
    localNote();
  }
  var pv = "enablejsapi=1&controls=0&rel=0&modestbranding=1&playsinline=1&disablekb=1&fs=0&iv_load_policy=3";
  if(https) pv += "&origin="+encodeURIComponent(location.origin);
  var ifr=document.createElement("iframe");
  ifr.id="ytframe";
  ifr.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
  ifr.setAttribute("allow","autoplay; encrypted-media; picture-in-picture");
  ifr.setAttribute("title","What is Grooming?");
  ifr.src="https://www.youtube-nocookie.com/embed/"+YT_ID+"?"+pv;
  var host=el("ytbox"); host.parentNode.replaceChild(ifr,host);

  var tag=document.createElement("script");
  tag.src="https://www.youtube.com/iframe_api";
  tag.onerror=function(){ showTrouble(); };
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady=function(){
    player=new YT.Player("ytframe",{
      events:{
        onReady:function(){ ready=true; },
        onError:function(ev){ showTrouble(ev&&ev.data); }
      }
    });
  };
  setTimeout(function(){ if(!ready) showTrouble(); }, 9000);
}
function showTrouble(code){
  el("vnote").hidden=false;
  if(code) el("vnoteM").textContent="Το YouTube δεν επιτρέπει την αναπαραγωγή εδώ (κωδικός "+code+"). Άνοιξέ το σε νέα καρτέλα και δες το μέρος που σου αναλογεί.";
}
function localNote(){
  el("vnote").hidden=false;
  el("vnoteT").textContent="Το βίντεο δεν παίζει όταν το αρχείο ανοίγει από τον υπολογιστή.";
  el("vnoteM").textContent="Όταν το μάθημα ανέβει σε ιστοσελίδα ή στο Moodle, το βίντεο παίζει κανονικά μέσα στη σελίδα. Προς το παρόν, άνοιξέ το σε νέα καρτέλα και δες το μέρος που σου αναλογεί.";
}
el("troubleBtn").addEventListener("click", showTrouble);

function curTime(){
  if(useLocal) return vEl?vEl.currentTime:0;
  return (player&&player.getCurrentTime)?player.getCurrentTime():0;
}
function seek(t){
  if(useLocal){ if(vEl) vEl.currentTime=t; return; }
  if(player&&player.seekTo) player.seekTo(t,true);
}
function play(){ if(useLocal){ if(vEl) vEl.play(); } else if(player&&player.playVideo) player.playVideo(); }
function pause(){ if(useLocal){ if(vEl) vEl.pause(); } else if(player&&player.pauseVideo) player.pauseVideo(); }
function stopVideo(){ if(timer){clearInterval(timer);timer=null;} pause(); el("pauseBtn").hidden=true; }

function mountPart(i){
  curPart=i;
  var p=PARTS[i];
  el("vchip").textContent="Μέρος "+(i+1)+" από 5";
  el("vlink").href="https://www.youtube.com/watch?v="+YT_ID+"&t="+p.s+"s";
  el("vlink").textContent="Άνοιγμα του βίντεο από "+mmss(p.s)+" έως "+mmss(p.e)+" ▸";
  el("barFill").style.width="0%";
  el("tm").textContent="0:00 / "+mmss(p.e-p.s);
  el("pauseBtn").hidden=true;
  el("shade").hidden=false;
  el("playBtn").textContent = watched[i] ? "▶ Δες το ξανά" : "▶ Παίξε αυτό το μέρος";
  el("againBtn").hidden=true;
  if(timer){clearInterval(timer);timer=null;}
  pause();
  renderThread(i);
}

el("playBtn").addEventListener("click", startSeg);
el("againBtn").addEventListener("click", startSeg);
el("pauseBtn").addEventListener("click", function(){
  pause(); el("pauseBtn").hidden=true; el("shade").hidden=false;
  el("playBtn").textContent="▶ Συνέχισε";
});
el("skipBtn").addEventListener("click", function(){
  el("vnote").hidden=true;
  finishSeg(curPart,false);
});

function startSeg(){
  var i=curPart, p=PARTS[i];
  if(!ready){ showTrouble(); el("vnote").scrollIntoView({block:"nearest",behavior:"smooth"}); return; }
  var t=curTime();
  if(t < p.s || t >= p.e-0.3) seek(p.s);
  play();
  el("shade").hidden=true;
  el("pauseBtn").hidden=false;
  el("againBtn").hidden=true;
  if(timer) clearInterval(timer);
  timer=setInterval(function(){
    var c=curTime();
    if(c<p.s-1.2){ seek(p.s); return; }
    var pr=Math.max(0,Math.min(1,(c-p.s)/(p.e-p.s)));
    el("barFill").style.width=(pr*100)+"%";
    el("tm").textContent=mmss(c-p.s)+" / "+mmss(p.e-p.s);
    if(c>=p.e-0.15){
      clearInterval(timer); timer=null;
      pause();
      el("barFill").style.width="100%";
      el("pauseBtn").hidden=true;
      el("againBtn").hidden=false;
      el("shade").hidden=true;
      finishSeg(i,true);
    }
  },200);
}

function finishSeg(i,natural){
  el("againBtn").hidden=false;
  if(natural){ el("shade").hidden=true; }
  else { el("shade").hidden=false; el("playBtn").textContent="▶ Δες το ξανά"; }
  if(watched[i]) return;
  watched[i]=true;
  if(cur===i+1) typeThen(i);
}

/* ---------------- συνομιλία ---------------- */
function renderThread(i){
  var th=el("th"+i);
  if(!watched[i]){
    th.innerHTML='<p class="hint" id="hint'+i+'">Δες πρώτα το μέρος '+(i+1)+' του βίντεο. Μόλις τελειώσει, ο Μαρκ θα σου γράψει.</p>';
    el("cmp"+i).hidden=true;
    el("nx"+i).hidden = sent[i]===null;
    return;
  }
  th.innerHTML="";
  addMark(i, PARTS[i].q);
  if(sent[i]!==null){
    addMe(i, sent[i]);
    addSugg(i);
    el("cmp"+i).hidden=true;
    el("nx"+i).hidden=false;
  }else{
    el("cmp"+i).hidden=false;
    el("nx"+i).hidden=true;
  }
}
function typeThen(i){
  var th=el("th"+i);
  th.innerHTML='<div class="msg"><span class="av"><img data-key="markAv" alt="'+esc(ALT_MARK)+'"></span><span class="typing"><i></i><i></i><i></i></span></div>';
  th.querySelector("img").src=ASSETS.markAv;
  setTimeout(function(){
    if(!el("sc"+(i+1)).classList.contains("on")) { renderThread(i); return; }
    th.innerHTML="";
    addMark(i, PARTS[i].q);
    el("cmp"+i).hidden=false;
    var ta=el("ta"+i); if(ta) ta.focus();
  }, 1200);
}
function addMark(i,txt){
  var d=document.createElement("div");
  d.className="msg";
  d.innerHTML='<span class="av fig" tabindex="0" data-zoom="mark" data-alt="'+esc(ALT_MARK)+'">'+
              '<img data-key="markAv" alt="'+esc(ALT_MARK)+'"><span class="alt">'+esc(ALT_MARK)+'</span></span>'+
              '<span class="bub">'+esc(txt)+'</span>';
  d.querySelector("img").src=ASSETS.markAv;
  el("th"+i).appendChild(d);
}
function addMe(i,txt){
  var d=document.createElement("div");
  d.className="msg me";
  d.innerHTML='<span class="bub">'+esc(txt)+'</span>';
  el("th"+i).appendChild(d);
}
function addSugg(i){
  var d=document.createElement("div");
  d.className="sugg";
  d.innerHTML='<h4>Ενδεικτική απάντηση — Suggested answer</h4><p>'+esc(PARTS[i].a)+'</p>';
  el("th"+i).appendChild(d);
}

for(var j=0;j<5;j++){ (function(i){
  var ta=el("ta"+i), btn=el("send"+i), wc=el("wc"+i);
  function count(){
    var v=ta.value.trim();
    var n = v? v.split(/\s+/).length : 0;
    wc.innerHTML="<b>"+n+"</b> "+(n===1?"λέξη":"λέξεις");
    btn.disabled = n<3;
  }
  ta.addEventListener("input", count);
  btn.addEventListener("click", function(){
    var v=ta.value.trim();
    if(v.split(/\s+/).length<3) return;
    sent[i]=v;
    el("cmp"+i).hidden=true;
    addMe(i,v);
    setTimeout(function(){ addSugg(i); el("nx"+i).hidden=false; markDone(); }, 500);
    markDone();
  });
})(j); }

function markDone(){
  Array.prototype.forEach.call(rail.children,function(b,idx){
    if(idx>=1&&idx<=5) b.classList.toggle("done", sent[idx-1]!==null);
  });
}

/* ---------------- λέξεις κλειδιά ---------------- */
document.addEventListener("click", function(e){
  var f=e.target.closest?e.target.closest(".flip"):null;
  if(!f) return;
  var was=f.classList.contains("f");
  f.classList.toggle("f");
  if(!was && !f.dataset.seen){ f.dataset.seen="1"; flipped++; el("kcount").textContent=flipped; }
});

/* ---------------- ανακεφαλαίωση ---------------- */
function buildRecap(){
  var h="";
  for(var i=0;i<5;i++){
    h+='<div class="rec">'+
       '<div class="q"><b>Mark — Question '+(i+1)+'</b>'+esc(PARTS[i].q)+'</div>'+
       '<div class="a">'+(sent[i]!==null?esc(sent[i]):'<em>Δεν έστειλες απάντηση σε αυτή την ερώτηση.</em>')+'</div>'+
       '<div class="s"><b>Ενδεικτική απάντηση</b>'+esc(PARTS[i].a)+'</div>'+
       '</div>';
  }
  el("recap").innerHTML=h;
}
el("copyBtn").addEventListener("click", function(){
  var t="Let’s Talk About Personal Data — Safety on the Internet\n\n";
  for(var i=0;i<5;i++){
    t+="Question "+(i+1)+": "+PARTS[i].q+"\n";
    t+="My answer: "+(sent[i]!==null?sent[i]:"—")+"\n\n";
  }
  var ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Αντιγράφηκε!"); }
  catch(err){ toast("Δεν έγινε η αντιγραφή."); }
  document.body.removeChild(ta);
});

/* ---------------- εκκίνηση ---------------- */
buildPlayer();
go(0);
})();
</script>
</body>
</html>
