<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Numbers in daily life</title>
<style>
:root{
  --ink:#12314A; --ink2:#3B5D77; --paper:#FFFFFF; --bg:#EAF4FB;
  --sea:#1E7FB8; --sea-d:#125E8C; --sun:#FFB020; --sun-d:#E08A00;
  --leaf:#3FA34D; --leaf-d:#2E7C39; --rose:#E4572E; --rose-d:#B93E1C;
  --lilac:#7B61C9; --line:#D3E4F0; --soft:#F4FAFE;
  --sh:0 10px 26px -14px rgba(18,49,74,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",Tahoma,Verdana,system-ui,-apple-system,sans-serif;
  color:var(--ink); background:var(--bg);
  background-image:radial-gradient(circle at 12% 8%,rgba(255,176,32,.16),transparent 42%),
                   radial-gradient(circle at 88% 6%,rgba(30,127,184,.16),transparent 44%),
                   radial-gradient(circle at 50% 100%,rgba(123,97,201,.12),transparent 55%);
  background-attachment:fixed;
  line-height:1.55; -webkit-text-size-adjust:100%;
}

/* ---------- κεφαλίδα ---------- */
.top{
  position:sticky; top:0; z-index:60; background:var(--paper);
  border-bottom:1px solid var(--line); box-shadow:0 10px 14px -12px rgba(18,49,74,.4);
}
.top .in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .bug{
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--sea),var(--lilac));color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;
  box-shadow:0 6px 14px -6px rgba(30,127,184,.8)
}
.brand h1{margin:0;font-size:19px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:7px;margin-left:auto;align-items:center}
.dots button{
  width:12px;height:12px;border-radius:50%;border:2px solid var(--sea);background:transparent;
  padding:0;cursor:pointer;transition:.2s
}
.dots button.on{background:var(--sea);transform:scale(1.35)}
.dots button.done{background:var(--leaf);border-color:var(--leaf)}
.dots button:disabled{opacity:.35;cursor:default}
.bar{height:4px;background:var(--soft)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--leaf));transition:width .45s ease}

/* ---------- σκελετός ---------- */
main{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
.screen{display:none;animation:fade .38s ease}
.screen.on{display:block}
.screen[hidden]{display:none}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--sh)
}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.grid>*{min-width:0}

/* ---------- εξώφυλλο ---------- */
.cover{text-align:center}
.cover h2{margin:0 0 6px;font-size:clamp(26px,5vw,40px);letter-spacing:.3px;color:var(--sea-d)}
.cover .sub{margin:0 0 18px;color:var(--ink2);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 4px}
.chip{
  background:var(--soft);border:1px solid var(--line);color:var(--ink2);
  border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600
}
.chip.en{background:#FFF6E4;border-color:#FFE0A8;color:#8A5B00}
.klist{margin:10px 0 0;color:var(--ink2);font-size:13.5px}

/* ---------- εικόνες / zoom / alt ---------- */
.zi{position:relative;display:block;cursor:zoom-in;outline:none}
.zi img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line)}
.zi::after{
  content:attr(data-alt);position:absolute;left:50%;bottom:calc(100% + 11px);transform:translateX(-50%);
  background:#0E2233;color:#fff;padding:8px 12px;border-radius:11px;font-size:13px;line-height:1.35;
  width:max-content;max-width:min(88%,400px);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s;box-shadow:0 12px 24px -12px rgba(0,0,0,.7)
}
.zi::before{
  content:"";position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);
  border:7px solid transparent;border-top-color:#0E2233;opacity:0;pointer-events:none;transition:opacity .18s
}
.zi.below::after{bottom:auto;top:calc(100% + 11px)}
.zi.below::before{bottom:auto;top:calc(100% + 4px);border-top-color:transparent;border-bottom-color:#0E2233}
.zi:hover::after,.zi:focus-visible::after,.zi.on::after,
.zi:hover::before,.zi:focus-visible::before,.zi.on::before{opacity:1}
.zi:hover,.zi:focus-visible,.zi.on{z-index:30}
.zi .mag{
  position:absolute;right:10px;bottom:10px;background:rgba(14,34,51,.86);color:#fff;
  border-radius:10px;padding:4px 9px;font-size:12px;font-weight:700;pointer-events:none
}
.credit{margin:8px 2px 0;font-size:12px;color:#6B87A0}
.scenetag{
  display:inline-block;background:linear-gradient(135deg,var(--lilac),var(--sea));color:#fff;
  border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:800;letter-spacing:.3px;margin-bottom:10px
}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;background:rgba(8,20,32,.93);display:none;place-items:center;padding:16px;z-index:200}
.lb.on{display:grid}
.lb .box{width:100%;max-width:1200px;min-width:0}
.lb img{width:100%;height:auto;max-height:78vh;object-fit:contain;border-radius:14px;background:#111}
.lb .cap{color:#DCEBF7;font-size:14px;text-align:center;margin-top:12px;padding:0 6px}
.lbx{
  position:fixed;top:16px;right:16px;z-index:210;width:44px;height:44px;border-radius:50%;
  background:#0E2233;color:#fff;border:2px solid #fff;font-size:20px;line-height:1;cursor:pointer;
  display:none;place-items:center;box-shadow:0 8px 20px -8px #000
}
.lbx.on{display:grid}

/* ---------- ηχητικό ---------- */
.audio{
  background:linear-gradient(150deg,#12314A,#1E5D86);color:#fff;border-radius:20px;padding:18px;
  box-shadow:var(--sh);border:1px solid rgba(255,255,255,.14)
}
.audio h3{margin:0 0 4px;font-size:16px;letter-spacing:.3px;color:#fff}
.audio p.h{margin:0 0 14px;font-size:13px;color:#B9D7EA}
.arow{display:flex;align-items:center;gap:14px}
.play{
  width:64px;height:64px;flex:0 0 64px;border-radius:50%;border:none;cursor:pointer;
  background:var(--sun);color:#3A2400;font-size:25px;display:grid;place-items:center;
  box-shadow:0 10px 22px -10px rgba(255,176,32,.95);transition:transform .15s
}
.play:hover{transform:scale(1.07)}
.play:active{transform:scale(.96)}
.play.playing{background:#fff;color:var(--sea-d)}
.wave{display:flex;align-items:flex-end;gap:4px;height:38px;flex:1;min-width:0}
.wave i{flex:1;max-width:9px;background:rgba(255,255,255,.35);border-radius:4px;height:22%;transition:height .12s}
.audio.play-on .wave i{animation:bump .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}
.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.15s}
.wave i:nth-child(6){animation-delay:.25s}.wave i:nth-child(7){animation-delay:.05s}
.wave i:nth-child(8){animation-delay:.35s}.wave i:nth-child(9){animation-delay:.2s}
.wave i:nth-child(10){animation-delay:.1s}.wave i:nth-child(11){animation-delay:.3s}
.wave i:nth-child(12){animation-delay:.18s}
@keyframes bump{0%,100%{height:20%}50%{height:100%}}
.aprog{height:6px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:14px;overflow:hidden}
.aprog i{display:block;height:100%;width:0;background:var(--sun);border-radius:4px}
.acount{margin-top:9px;font-size:12.5px;color:#B9D7EA}

/* ---------- ερώτηση ---------- */
.gate{
  margin-top:16px;background:#FFF6E4;border:1px dashed #F1C46B;border-radius:16px;
  padding:14px 16px;color:#8A5B00;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center
}
.gate[hidden]{display:none}
.q{margin-top:16px}
.q[hidden]{display:none}
.qh{display:flex;gap:10px;align-items:baseline;margin-bottom:12px}
.qn{
  background:var(--lilac);color:#fff;border-radius:9px;padding:2px 9px;font-size:12.5px;font-weight:800;flex:0 0 auto
}
.qt{margin:0;font-size:19px;font-weight:800;color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{
  display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--paper);border:2px solid var(--line);border-radius:15px;padding:12px 14px;
  font:inherit;font-size:16px;color:var(--ink);cursor:pointer;transition:.16s
}
.opt .k{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--soft);color:var(--sea-d);
  display:grid;place-items:center;font-weight:800;font-size:14px;border:1px solid var(--line)
}
.opt:hover{border-color:var(--sea);transform:translateX(3px)}
.opt.good{border-color:var(--leaf);background:#EFFAF0}
.opt.good .k{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.opt.bad{border-color:var(--rose);background:#FDF0EC}
.opt.bad .k{background:var(--rose);color:#fff;border-color:var(--rose)}
.opt.dim{opacity:.5}
.q.locked .opt:not(.good):not(.bad):hover{border-color:var(--line);transform:none}
.fb{
  margin-top:13px;border-radius:15px;padding:13px 15px;font-size:15px;border-left:8px solid var(--sea);
  background:var(--soft)
}
.fb[hidden]{display:none}
.fb b{display:block;font-size:13px;letter-spacing:.4px;margin-bottom:3px}
.fb.ok{background:#EFFAF0;border-left-color:var(--leaf);color:#1F5A28}
.fb.no{background:#FDF0EC;border-left-color:var(--rose);color:#8C2E12}
.fb.rev{background:#FFF6E4;border-left-color:var(--sun-d);color:#7A4E00}
.tries{font-size:12.5px;color:var(--ink2);margin-top:10px}

/* ---------- κείμενο ηχητικού ---------- */
.script{margin-top:16px}
.script[hidden]{display:none}
.script button{
  background:var(--paper);border:2px solid var(--sea);color:var(--sea-d);border-radius:13px;
  padding:9px 15px;font:inherit;font-weight:700;font-size:14px;cursor:pointer
}
.script button:hover{background:var(--soft)}
.sbody{
  margin-top:11px;background:#0E2233;color:#EAF4FB;border-radius:15px;padding:15px 17px;
  font-size:16px;line-height:1.7;display:none
}
.sbody.on{display:block;animation:fade .3s ease}
.sbody b{color:var(--sun)}

/* ---------- κουμπιά ---------- */
.nav{display:flex;gap:12px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:9px;border:none;border-radius:14px;padding:13px 22px;
  font:inherit;font-weight:800;font-size:15.5px;cursor:pointer;transition:.16s;letter-spacing:.3px
}
.btn[hidden]{display:none}
.btn.p{background:linear-gradient(135deg,var(--sea),var(--sea-d));color:#fff;box-shadow:0 10px 20px -10px rgba(18,94,140,.95)}
.btn.g{background:linear-gradient(135deg,var(--leaf),var(--leaf-d));color:#fff;box-shadow:0 10px 20px -10px rgba(46,124,57,.95)}
.btn.s{background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.btn.y{background:linear-gradient(135deg,var(--sun),var(--sun-d));color:#3A2400;box-shadow:0 10px 20px -10px rgba(224,138,0,.95)}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.big{font-size:17px;padding:15px 30px}

/* ---------- αποτελέσματα ---------- */
.res{text-align:center}
.ring{width:180px;height:180px;margin:6px auto 14px;display:block}
.ring .trk{fill:none;stroke:#DCEBF7;stroke-width:13}
.ring .val{fill:none;stroke:var(--leaf);stroke-width:13;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray 1s ease}
.ring text.pc{font:800 26px "Segoe UI",sans-serif;fill:var(--ink);text-anchor:middle}
.ring text.sm{font:600 12px "Segoe UI",sans-serif;fill:#6B87A0;text-anchor:middle}
.band{
  max-width:640px;margin:0 auto;border-radius:18px;padding:16px 18px;font-size:16px;
  background:var(--soft);border:1px solid var(--line);text-align:left
}
.band.hi{background:#EFFAF0;border-color:#B8E3BE}
.band.mid{background:#FFF6E4;border-color:#FFE0A8}
.band.lo{background:#FDF0EC;border-color:#F7C9B9}
.done{
  max-width:640px;margin:14px auto 0;background:linear-gradient(135deg,var(--lilac),var(--sea));
  color:#fff;border-radius:18px;padding:14px 18px;font-size:16px;font-weight:700
}
.recap{max-width:640px;margin:18px auto 0;display:grid;gap:9px;text-align:left}
.rrow{
  display:flex;gap:11px;align-items:center;background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:11px 14px;font-size:14.5px
}
.rrow .mk{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.rrow.ok .mk{background:var(--leaf)}
.rrow.no .mk{background:var(--rose)}

.pop{position:fixed;pointer-events:none;font-size:22px;z-index:150;animation:up 1.1s ease-out forwards}
@keyframes up{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-90px) scale(1.3)}}

@media(max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}
  main{padding:16px 13px 50px}
  .card{padding:15px;border-radius:18px}
  .brand h1{font-size:16px}
  .qt{font-size:17px}
  .zi::after{max-width:82%}
}
</style>
</head>

<header class="top">
  <div class="in">
    <div class="brand">
      <span class="bug">123</span>
      <h1>Numbers in daily life</h1>
    </div>
    <nav class="dots" id="dots" aria-label="Πλοήγηση οθονών"></nav>
  </div>
  <div class="bar"><i id="pbar"></i></div>
</header>

<main>

  <!-- ======== ΟΘΟΝΗ 0 ======== -->
  <section class="screen on" id="sc0">
    <div class="card cover">
      <span class="zi" tabindex="0" data-alt="Numbers in daily life">
        <img data-key="cover" alt="Numbers in daily life">
        <span class="mag">🔍 κλικ</span>
      </span>
      <h2 style="margin-top:18px">Numbers in daily life</h2>
      <p class="sub">Listening &amp; Comprehension</p>
      <div class="chips">
        <span class="chip en">Numbers</span><span class="chip en">Age</span><span class="chip en">Time</span>
        <span class="chip en">Daily Routine</span><span class="chip en">Listening</span><span class="chip en">Comprehension</span>
      </div>
      <p class="klist">Αριθμοί · Ηλικία · Ώρα · Καθημερινότητα · Κατανόηση Προφορικού Λόγου</p>
      <div class="nav" style="justify-content:center">
        <button class="btn p big" data-go="1">Ξεκίνα ▶</button>
      </div>
    </div>
  </section>

  <!-- ======== ΣΚΗΝΕΣ ======== -->
  <section class="screen" id="sc1" data-scene="0"></section>
  <section class="screen" id="sc2" data-scene="1"></section>
  <section class="screen" id="sc3" data-scene="2"></section>

  <!-- ======== ΑΠΟΤΕΛΕΣΜΑΤΑ ======== -->
  <section class="screen" id="sc4">
    <div class="card res">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="trk" cx="50" cy="50" r="40"></circle>
        <circle class="val" id="rval" cx="50" cy="50" r="40" stroke-dasharray="0 251.3"></circle>
        <text class="pc" id="rpc" x="50" y="48">0%</text>
        <text class="sm" id="rsm" x="50" y="64">0/3</text>
      </svg>
      <div class="band" id="band"></div>
      <div class="done" id="done"></div>
      <div class="recap" id="recap"></div>
      <div class="nav" style="justify-content:center;margin-top:24px">
        <button class="btn s" data-go="0">↺ Ξανά από την αρχή</button>
      </div>
    </div>
  </section>

</main>

<div class="lb" id="lb"><div class="box"><img id="lbi" alt=""><div class="cap" id="lbc"></div></div></div>
<button class="lbx" id="lbx" aria-label="Κλείσιμο">✕</button>

var N = 5, cur = 0;
var st = SC.map(function(){ return {plays:0, tries:0, res:null, done:false}; });
var au = null;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- χτίσιμο οθονών σκηνής ---------- */
function buildScene(i){
  var d = SC[i], sec = document.getElementById("sc"+(i+1));
  var o = "";
  for(var k=0;k<d.opts.length;k++){
    o += '<button class="opt" data-i="'+k+'"><span class="k">'+"ABCD"[k]+'</span><span>'+esc(d.opts[k])+'</span></button>';
  }
  var bars = ""; for(var b=0;b<12;b++) bars += "<i></i>";

  sec.innerHTML =
  '<div class="card">'+
    '<span class="scenetag">'+esc(d.tag)+'</span>'+
    '<div class="grid">'+
      '<div>'+
        '<span class="zi" tabindex="0" data-alt="'+esc(d.alt)+'">'+
          '<img data-key="'+d.img+'" alt="'+esc(d.alt)+'">'+
          '<span class="mag">🔍 κλικ</span>'+
        '</span>'+
        '<p class="credit">'+esc(d.credit)+'</p>'+
      '</div>'+
      '<div>'+
        '<div class="audio" data-au>'+
          '<h3>🎧 Listen</h3>'+
          '<p class="h">Listen and respond to the questions.</p>'+
          '<div class="arow">'+
            '<button class="play" data-play aria-label="Αναπαραγωγή">▶</button>'+
            '<span class="wave">'+bars+'</span>'+
          '</div>'+
          '<div class="aprog"><i data-ap></i></div>'+
          '<div class="acount" data-cnt>Ακροάσεις: 0</div>'+
        '</div>'+

        '<div class="gate" data-gate><span>👂</span><span>Άκουσε πρώτα ολόκληρο το ηχητικό για να εμφανιστεί η ερώτηση.</span></div>'+

        '<div class="q" data-q hidden>'+
          '<div class="qh"><span class="qn">Q'+(i+1)+'</span><p class="qt">'+esc(d.q)+'</p></div>'+
          '<div class="opts" data-opts>'+o+'</div>'+
          '<div class="fb" data-fb hidden></div>'+
          '<p class="tries" data-tries>Έχεις 2 προσπάθειες.</p>'+
          '<div class="script" data-sw hidden>'+
            '<button data-stog>📄 Δες το κείμενο που άκουσες</button>'+
            '<div class="sbody" data-sb>'+esc(d.script)+'</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="nav">'+
      '<button class="btn s" data-go="'+i+'">‹ Πίσω</button>'+
      '<button class="btn g" data-nx hidden>'+(i<2?"Επόμενη σκηνή ›":"Δες το αποτέλεσμα ›")+'</button>'+
    '</div>'+
  '</div>';

  wireScene(i, sec);
}

/* ---------- λογική σκηνής ---------- */
function wireScene(i, sec){
  var d = SC[i], s = st[i];
  var box   = sec.querySelector("[data-au]"),
      play  = sec.querySelector("[data-play]"),
      ap    = sec.querySelector("[data-ap]"),
      cnt   = sec.querySelector("[data-cnt]"),
      gate  = sec.querySelector("[data-gate]"),
      q     = sec.querySelector("[data-q]"),
      opts  = sec.querySelector("[data-opts]"),
      fb    = sec.querySelector("[data-fb]"),
      tries = sec.querySelector("[data-tries]"),
      sw    = sec.querySelector("[data-sw]"),
      stog  = sec.querySelector("[data-stog]"),
      sb    = sec.querySelector("[data-sb]"),
      nx    = sec.querySelector("[data-nx]");

  function reveal(){
    gate.hidden = true;
    if(q.hidden){ q.hidden = false; }
  }

  play.addEventListener("click", function(){
    if(!au){ au = new Audio(); }
    if(au.__owner === i && !au.paused){ au.pause(); return; }
    stopAudio();
    au.__owner = i;
    au.src = ASSETS[d.aud];
    box.classList.add("play-on"); play.classList.add("playing"); play.textContent = "❚❚";
    var guard = setTimeout(reveal, 9000);
    au.ontimeupdate = function(){
      if(au.duration) ap.style.width = (au.currentTime/au.duration*100)+"%";
    };
    au.onended = function(){
      clearTimeout(guard);
      s.plays++; cnt.textContent = "Ακροάσεις: "+s.plays;
      resetBtn(); ap.style.width = "100%";
      reveal();
    };
    au.onerror = function(){ clearTimeout(guard); resetBtn(); reveal(); };
    au.onpause = function(){ resetBtn(); };
    var p = au.play();
    if(p && p.catch) p.catch(function(){ clearTimeout(guard); resetBtn(); reveal(); });
  });

  function resetBtn(){
    box.classList.remove("play-on"); play.classList.remove("playing"); play.textContent = "▶";
  }
  sec.__stop = function(){ resetBtn(); };

  opts.addEventListener("click", function(e){
    var b = e.target.closest(".opt"); if(!b) return;
    if(s.res !== null) return;
    if(b.classList.contains("bad")) return;
    var idx = +b.dataset.i;
    s.tries++;

    if(idx === d.ok){
      b.classList.add("good");
      lock();
      s.res = "ok";
      show("ok", "ΣΩΣΤΑ", d.fbOk);
      confetti(b);
    } else if(s.tries === 1){
      b.classList.add("bad");
      show("no", "ΠΡΟΣΠΑΘΗΣΕ ΞΑΝΑ", d.fb1);
      tries.textContent = "Σου μένει 1 προσπάθεια.";
    } else {
      b.classList.add("bad");
      opts.children[d.ok].classList.add("good");
      lock();
      s.res = "no";
      show("rev", "Η ΣΩΣΤΗ ΑΠΑΝΤΗΣΗ: "+d.opts[d.ok], d.fb2);
    }
  });

  function lock(){
    q.classList.add("locked");
    for(var k=0;k<opts.children.length;k++){
      var c = opts.children[k];
      if(!c.classList.contains("good") && !c.classList.contains("bad")) c.classList.add("dim");
    }
    tries.textContent = "";
    sw.hidden = false;
    nx.hidden = false;
    s.done = true;
    paint();
  }

  function show(cls, head, txt){
    fb.className = "fb " + cls;
    fb.innerHTML = "<b>"+esc(head)+"</b>"+esc(txt);
    fb.hidden = false;
  }

  stog.addEventListener("click", function(){
    var on = sb.classList.toggle("on");
    stog.textContent = on ? "📄 Κρύψε το κείμενο" : "📄 Δες το κείμενο που άκουσες";
  });

  nx.addEventListener("click", function(){ go(cur+1); });
}

function stopAudio(){
  if(!au) return;
  au.pause();
  for(var i=1;i<=3;i++){
    var sec = document.getElementById("sc"+i);
    if(sec && sec.__stop) sec.__stop();
  }
}

/* ---------- πλοήγηση ---------- */
function go(n){
  if(n < 0 || n >= N) return;
  if(n > 0 && n < 4 && !allowed(n)) return;
  if(n === 4 && !st[2].done) return;
  stopAudio();
  for(var i=0;i<N;i++){
    document.getElementById("sc"+i).classList.toggle("on", i === n);
  }
  cur = n;
  if(n === 4) results();
  paint();
  window.scrollTo({top:0, behavior:"smooth"});
}
function allowed(n){
  if(n <= 1) return true;
  return st[n-2].done;
}

var dots = document.getElementById("dots");
(function(){
  var labels = ["Εξώφυλλο","Scene 1","Scene 2","Scene 3","Αποτέλεσμα"];
  for(var i=0;i<N;i++){
    var b = document.createElement("button");
    b.title = labels[i]; b.setAttribute("aria-label", labels[i]);
    b.dataset.i = i;
    dots.appendChild(b);
  }
  dots.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b || b.disabled) return;
    go(+b.dataset.i);
  });
})();

function paint(){
  var kids = dots.children;
  for(var i=0;i<N;i++){
    kids[i].classList.toggle("on", i === cur);
    kids[i].classList.toggle("done", i>=1 && i<=3 && st[i-1].done);
    var ok = (i===0) || (i<=1) || (i<=3 && st[i-2] && st[i-2].done) || (i===4 && st[2].done);
    kids[i].disabled = !ok;
  }
  var d = 0;
  for(var k=0;k<3;k++) if(st[k].done) d++;
  document.getElementById("pbar").style.width = (cur===4 ? 100 : (d/3*90 + (cur>0?10:0))) + "%";
}

document.addEventListener("click", function(e){
  var g = e.target.closest("[data-go]");
  if(!g) return;
  var n = +g.dataset.go;
  if(n === 0 && cur === 4) restart();
  go(n);
});

function restart(){
  stopAudio();
  for(var i=0;i<3;i++){
    st[i] = {plays:0, tries:0, res:null, done:false};
    buildScene(i);
  }
  var imgs = document.querySelectorAll("img[data-key]");
  for(var j=0;j<imgs.length;j++) imgs[j].src = ASSETS[imgs[j].dataset.key];
}
document.addEventListener("keydown", function(e){
  if(document.getElementById("lb").classList.contains("on")){
    if(e.key === "Escape") closeLb();
    return;
  }
  if(e.target && /^(INPUT|TEXTAREA|BUTTON)$/.test(e.target.tagName) && e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if(e.key === "ArrowRight") go(cur+1);
  if(e.key === "ArrowLeft") go(cur-1);
});

/* ---------- αποτελέσματα ---------- */
function setRing(v){ document.getElementById("rval").style.stroke = "var("+v+")"; }

function results(){
  var c = 0;
  for(var i=0;i<3;i++) if(st[i].res === "ok") c++;
  var pc = Math.round(c/3*100);
  var C = 2 * Math.PI * 40;
  var rv = document.getElementById("rval");
  rv.setAttribute("stroke-dasharray", "0 "+C.toFixed(1));
  rv.style.opacity = pc ? 1 : 0;
  setTimeout(function(){ rv.setAttribute("stroke-dasharray", (C*pc/100).toFixed(1)+" "+C.toFixed(1)); }, 120);
  document.getElementById("rpc").textContent = pc + "%";
  document.getElementById("rsm").textContent = c + "/3";

  var band = document.getElementById("band");
  if(pc >= 80){ band.className = "band hi"; band.textContent = BANDS.hi; setRing("--leaf"); }
  else if(pc >= 50){ band.className = "band mid"; band.textContent = BANDS.mid; setRing("--sun-d"); }
  else { band.className = "band lo"; band.textContent = BANDS.lo; setRing("--rose"); }

  document.getElementById("done").textContent = DONEMSG;

  var r = document.getElementById("recap"); r.innerHTML = "";
  for(var j=0;j<3;j++){
    var ok = st[j].res === "ok";
    var row = document.createElement("div");
    row.className = "rrow " + (ok ? "ok" : "no");
    row.innerHTML = '<span class="mk">'+(ok?"✓":"✕")+'</span><span><b>'+esc(SC[j].tag)+'</b> — '+esc(SC[j].q)+' <i>'+esc(SC[j].opts[SC[j].ok])+'</i></span>';
    r.appendChild(row);
  }
}

/* ---------- lightbox + alt tooltip ---------- */
var lb = document.getElementById("lb"), lbi = document.getElementById("lbi"),
    lbc = document.getElementById("lbc"), lbx = document.getElementById("lbx");

function openLb(z){
  var im = z.querySelector("img");
  lbi.src = im.src;
  lbi.alt = im.alt;
  lbc.textContent = z.dataset.alt || "";
  lb.classList.add("on"); lbx.classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeLb(){
  lb.classList.remove("on"); lbx.classList.remove("on");
  lbi.removeAttribute("src");
  document.body.style.overflow = "";
}
lbx.addEventListener("click", closeLb);
lb.addEventListener("click", closeLb);

function side(z){
  var r = z.getBoundingClientRect();
  z.classList.toggle("below", r.top < 130);
}
document.addEventListener("mouseover", function(e){
  var z = e.target.closest(".zi"); if(z) side(z);
});
document.addEventListener("focusin", function(e){
  var z = e.target.closest(".zi"); if(z) side(z);
});
document.addEventListener("click", function(e){
  var z = e.target.closest(".zi"); if(!z) return;
  var all = document.querySelectorAll(".zi.on");
  for(var i=0;i<all.length;i++) all[i].classList.remove("on");
  openLb(z);
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  var z = document.activeElement && document.activeElement.closest ? document.activeElement.closest(".zi") : null;
  if(!z) return;
  e.preventDefault(); side(z); openLb(z);
});

/* ---------- κομφετί ---------- */
function confetti(el){
  var r = el.getBoundingClientRect(), ch = ["⭐","🎉","✨","👏","🥳"];
  for(var i=0;i<7;i++){
    (function(i){
      var s = document.createElement("span");
      s.className = "pop"; s.textContent = ch[i % ch.length];
      s.style.left = (r.left + r.width*(0.15 + 0.7*Math.random())) + "px";
      s.style.top  = (r.top + 6) + "px";
      s.style.animationDelay = (i*0.06) + "s";
      document.body.appendChild(s);
      setTimeout(function(){ s.remove(); }, 1500);
    })(i);
  }
}

/* ---------- εκκίνηση ---------- */
for(var i=0;i<3;i++) buildScene(i);
var imgs = document.querySelectorAll("img[data-key]");
for(var j=0;j<imgs.length;j++) imgs[j].src = ASSETS[imgs[j].dataset.key];
paint();
})();
</script>
</body>
</html>
