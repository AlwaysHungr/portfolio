const list=document.getElementById("list"), tally=document.getElementById("tally"),
      q=document.getElementById("q"), chips=document.getElementById("chips");
const active=new Set();
const fmt=b=>b<1048576 ? Math.round(b/1024)+" KB" : (b/1048576).toFixed(1)+" MB";
const norm=s=>s.toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"");

function render(){
  const term=norm(q.value.trim());
  const rows=DATA.filter(r=>{
    if(active.size && ![...active].every(t=>r.tags.includes(t))) return false;
    if(!term) return true;
    return norm(r.t).includes(term) || (r.oer||"").includes(term);
  });
  tally.textContent = rows.length===DATA.length
    ? DATA.length+" μαθήματα"
    : rows.length+" από "+DATA.length+" μαθήματα";
  if(!rows.length){ list.innerHTML='<li class="empty">Κανένα μάθημα δεν ταιριάζει στα φίλτρα.</li>'; return; }
  list.innerHTML = rows.map(r=>`<li><a href="${r.f}">
      <span class="row"><span class="t">${r.t}</span><span class="m">${fmt(r.s)}</span></span>
      ${r.tags.length?`<span class="tg">${r.tags.map(t=>`<span>${t}</span>`).join("")}</span>`:""}
    </a></li>`).join("");
}
q.addEventListener("input",render);
chips.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  const t=b.dataset.tag;
  if(active.has(t)){active.delete(t);b.setAttribute("aria-pressed","false");}
  else{active.add(t);b.setAttribute("aria-pressed","true");}
  render();
});
[...chips.querySelectorAll(".chip")].forEach(b=>b.setAttribute("aria-pressed","false"));
render();
</script>
